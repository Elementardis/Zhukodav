<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="preload" href="images/ui/loading/assets/tablecloth_1920x1080.png" as="image" />
  <title>Click Them All</title>
  <link rel="preload" href="fonts/BalsamiqSans/BalsamiqSans-Bold.ttf" as="font" type="font/ttf" crossorigin />
  <style>
    @font-face {
      font-family: 'Balsamiq Sans';
      src: url('fonts/BalsamiqSans/BalsamiqSans-Bold.ttf') format('truetype');
      font-weight: 700 900;
      font-style: normal;
      font-display: swap;
    }
    html, body { margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #EEF2FF; }
    canvas { display: block; margin: 0; image-rendering: auto; }
    #preloader { position: fixed; inset: 0; z-index: 9999; background: #65b3c1 url('images/ui/loading/assets/tablecloth_1920x1080.png') center/cover no-repeat; overflow: hidden; transition: opacity 300ms; font-family: Arial, sans-serif; color: #321638; }
    .loading-scene { position: absolute; left: 50%; top: 50%; transform-origin: center; overflow: hidden; pointer-events: none; }
    .loading-bug { pointer-events: auto; cursor: pointer; border: 0; padding: 0; background: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .loading-bug:focus-visible { outline: 5px solid #2D1738; outline-offset: 4px; border-radius: 50%; }
    .loading-fallback { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(80vw, 500px); padding: 24px; border-radius: 24px; background: #fffaf0; text-align: center; }
    .loading-fallback [role="progressbar"] { height: 24px; border: 4px solid #321638; border-radius: 20px; overflow: hidden; }
    .loading-fallback [role="progressbar"] > div { width: 0; height: 100%; background: #00c5ba; }
    .loading-fallback button { margin-top: 16px; padding: 12px 24px; font: inherit; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { #preloader { transition: none; } }
  </style>
</head>
<body>
  <div id="preloader" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="loading-fallback">
      <p role="status">Загрузка…</p>
      <div role="progressbar" aria-label="Загрузка ресурсов" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div></div></div>
      <button hidden onclick="location.reload()">Повторить</button>
    </div>
  </div>
  <script src="js/preloader.js" onerror="document.querySelector('#preloader [role=status]').textContent='Не удалось загрузить игру. Обновите страницу.'"></script>
  <script src="js/pixi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
